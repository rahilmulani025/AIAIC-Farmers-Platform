services:
  aiaic-farmers-platform:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aiaic_farmers_platform_dev
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOST=0.0.0.0
    networks:
      - aiaic-network

networks:
  aiaic-network:
    driver: bridge
